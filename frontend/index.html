<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MathViz - Integration</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>MathViz</h1>
        <p>Interactive Integration Visualizer</p>
    </header>

    <main>

        <section class="card">

            <h2>Integration</h2>

            <label for="topic">Choose a Topic</label>

            <select id="topic">

                <option value="basic-integration">
                    Basic Integration
                </option>

                <option value="definite-integral">
                    Definite Integral
                </option>

                <option value="fundamental-theorem">
                    Fundamental Theorem of Calculus
                </option>

                <option value="substitution">
                    Integration by Substitution
                </option>

                <option value="integration-by-parts">
                    Integration by Parts
                </option>

                <option value="applications">
                    Applications of Integration
                </option>

                <option value="area-under-curve">
                    Area Under Curve
                </option>

                <option value="area-between-curves">
                    Area Between Curves
                </option>

                <option value="approximating-area">
                    Approximating Areas
                </option>

            </select>

            <div id="inputArea">

                <label for="function">
                    Function
                </label>

                <input
                    type="text"
                    id="function"
                    placeholder="Example: x**2"
                >

                <div id="bounds">

                    <div>
                        <label for="lowerBound">
                            Lower Bound
                        </label>

                        <input
                            type="number"
                            id="lowerBound"
                            placeholder="0"
                        >
                    </div>

                    <div>
                        <label for="upperBound">
                            Upper Bound
                        </label>

                        <input
                            type="number"
                            id="upperBound"
                            placeholder="3"
                        >
                    </div>

                </div>

            </div>

            <button id="calculateButton">
                Calculate
            </button>

        </section>


        <section class="card result-card">

            <h2>Result</h2>

            <div id="result">
                Enter a function and click Calculate.
            </div>

        </section>

    </main>


    <footer>
        <p>MathViz • Mathematical Visualization Platform</p>
    </footer>


    <script src="script.js"></script>

</body>
</html>
